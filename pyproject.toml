[project]
authors = [
    {name = "Norman Fomferra (Brockmann Consult GmbH)"},
    {name = "Yogesh Kumar Baljeet Singh  (Brockmann Consult GmbH)"}
]
dependencies = []
name = "irrigation-processor"
readme = "README.md"
description = "Processor for generating Irrigation Water Use (IWU) estimates datasets"
version = "0.1.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]
requires-python = ">=3.10"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
irrigation_processor = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ruff = ">=0.12.2,<0.13"
isort = ">=6.0.1,<7"
pytest = ">=8.4.1,<9"
pytest-cov = ">=6.2.1,<7"
jupyter = ">=1.1.1,<2"
xcube = ">=1.11.1,<2"
cartopy = ">=0.24.0,<0.25"
matplotlib = ">=3.10.3,<4"
xcube-cds = ">=1.1.0,<2"
h5netcdf = ">=1.6.3,<2"
xcube-clms = ">=1.1.0,<2"
xcube-cci = ">=0.11.9,<0.12"
